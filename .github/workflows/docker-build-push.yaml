name: Reusable Docker Build & Push

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag_latest:
        required: true
        type: string
      tag_version:
        required: false
        type: string
      push_latest:
        required: false
        type: boolean
        default: true
    secrets:
      ghcr_username:
        required: true
      ghcr_token:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.ghcr_username }}
          password: ${{ secrets.ghcr_token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.tag_latest }}
            ${{ inputs.tag_version != '' && format('{0}:{1}', inputs.image_name, inputs.tag_version) || '' }}

          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
